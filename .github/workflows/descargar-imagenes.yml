# Copia una sola vez las imágenes del sitio al repositorio (public/__l5e/...),
# para que el sitio no dependa de ningún almacenamiento externo.
name: Descargar imágenes del sitio

on:
  workflow_dispatch:
  push:
    branches: [claude/summaproducts-footer-test-0ebqm8]
    paths: [.github/workflows/descargar-imagenes.yml]

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar imágenes
        run: |
          set -u
          fail=0
          for f in src/assets/*.asset.json; do
            url=$(jq -r .url "$f")
            dest="public${url}"
            [ -s "$dest" ] && continue
            mkdir -p "$(dirname "$dest")"
            ok=0
            for host in https://summaproducts.com https://summaproducts.lovable.app; do
              if curl -fsSL --retry 3 -o "$dest" "${host}${url}"; then ok=1; break; fi
            done
            if [ $ok = 1 ]; then echo "OK  $url"; else echo "ERR $url"; rm -f "$dest"; fail=1; fi
          done
          exit $fail
      - name: Guardar en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/__l5e
          git diff --cached --quiet && exit 0
          git commit -m "Copia las imágenes del sitio al repositorio"
          git push
