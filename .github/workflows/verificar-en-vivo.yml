# Revisa la página en vivo desde fuera (temporal).
name: Verificar sitio en vivo
on:
  push:
    branches: [claude/summaproducts-footer-test-0ebqm8]
    paths: [.github/workflows/verificar-en-vivo.yml]
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://summaproducts.com https://www.summaproducts.com http://summaproducts.com; do
            echo "== $u"
            curl -sS -o /tmp/p.html -w "HTTP %{http_code} | final: %{url_effective} | ssl: %{ssl_verify_result}\n" -L "$u" || echo "fallo curl"
            grep -o "Prueba Claude[^<]*" /tmp/p.html || echo "(sin texto de prueba)"
            grep -o "<title>[^<]*" /tmp/p.html | head -1
          done
          echo "== certificado"
          echo | openssl s_client -connect summaproducts.com:443 -servername summaproducts.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates || echo "sin certificado válido aún"
          dig +short summaproducts.com A; dig +short www.summaproducts.com
